# The links of the README and website, checked once a week: they break without a change of ours.
name: Links

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1"

permissions: {}

jobs:
  links:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress './**/*.md' './www/**/*.html' --max-concurrency 8 --max-retries 6 --retry-wait-time 5
          token: ${{ secrets.GITHUB_TOKEN }}
